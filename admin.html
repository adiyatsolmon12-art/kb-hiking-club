<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KB Hiking Club — Удирдлага</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      background: #f4f6f5;
      color: #222;
    }
    h1 { color: #174d37; }
    .notice {
      background: white;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    button {
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      margin: 2px;
    }
    .approve { background: #167447; color: white; }
    .reject { background: #b42318; color: white; }
  </style>
</head>
<body>
  <h1>KB HIKING CLUB</h1>
  <h2>Гишүүн элсүүлэх хүсэлтүүд</h2>

  <div class="notice">
    Энэ хуудас гишүүний хүсэлтийг харах, зөвшөөрөх,
    эсвэл татгалзахад зориулагдсан.
  </div>

  <p>Удирдлагын хүсэлтийн жагсаалтыг дараагийн алхмаар холбоно.</p>
</body>
</html>
